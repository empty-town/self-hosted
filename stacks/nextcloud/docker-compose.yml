# Nextcloud. Two networks: caddy reaches the app on nextcloud_net; the
# database and cache sit on nextcloud_internal, which caddy is not attached to.

services:
  nextcloud:
    # Pinned to a specific major, not the rolling `stable-apache` tag, so
    # `docker compose pull` gets patches but never crosses a major on its own.
    # Nextcloud can't skip a major and a major bump migrates the DB one-way.
    # Bump this number BY HAND after reading the upgrade notes + taking a backup.
    image: nextcloud:34-apache
    container_name: nextcloud
    restart: unless-stopped
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NC_DB_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${DOMAIN}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=cloud.${DOMAIN}
      # The pinned subnet of nextcloud_net (see bootstrap.sh). Only caddy and
      # this app live there, so only caddy's X-Forwarded-For is trusted.
      - TRUSTED_PROXIES=172.30.30.0/24
    volumes:
      - nc_html:/var/www/html
      - ${NC_DATA_DIR}:/var/www/html/data
    networks:
      - nextcloud_net
      - nextcloud_internal
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    security_opt:
      - no-new-privileges:true

  nextcloud-db:
    image: mariadb:11
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      - MYSQL_ROOT_PASSWORD=${NC_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NC_DB_PASSWORD}
    volumes:
      - nc_db_data:/var/lib/mysql
    networks:
      - nextcloud_internal
    security_opt:
      - no-new-privileges:true

  nextcloud-redis:
    image: docker.io/valkey/valkey:8
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - nextcloud_internal
    security_opt:
      - no-new-privileges:true

networks:
  nextcloud_net:
    external: true
  nextcloud_internal:
    external: true

volumes:
  nc_html:
  nc_db_data:
